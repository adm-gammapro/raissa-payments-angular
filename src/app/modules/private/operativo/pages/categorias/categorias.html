<p-toast position="top-center"></p-toast>
<p-confirmdialog></p-confirmdialog>

<p-card class="shadow-xl rounded-xl border-none">
  <app-breadcrumb [itemsBread]="misItems"></app-breadcrumb>

  <form [formGroup]="filtroForm" (ngSubmit)="filtrar()">
    <p-table #dt
             [value]="categorias"
             [tableStyle]="{ 'min-width': '50rem' }"
             [paginator]="true"
             [totalRecords]="totalRecords"
             [lazy]="true"
             [loading]="loading"
             [rows]="5"
             [rowsPerPageOptions]="[5, 10, 20]"
             stripedRows
             [rowHover]="true"
             breakpoint="960px"
             [size]="'small'"
             (onLazyLoad)="loadLazy($event)"
             currentPageReportTemplate="Mostrando del {first} al {last} de {totalRecords} registros en total"
             showCurrentPageReport="true"
             sortField="id"
             [sortOrder]="1"
    >
      <!-- CAPTION: Filtros -->
      <ng-template #caption>
        <div class="flex flex-wrap items-end justify-between gap-3 mb-2 w-full">

          <!-- Filtros (izquierda) -->
          <div class="flex flex-wrap items-end gap-3">

            <!-- Búsqueda por descripción -->
            <div class="w-[280px] sm:w-[400px]">
              <p-iftalabel>
                <input
                  pInputText
                  type="text"
                  placeholder="Descripción"
                  class="w-full"
                  formControlName="descripcion"
                />
                <label for="codigoSolicitud">Búsqueda por descripción</label>
              </p-iftalabel>
            </div>

            <!-- Select Estado -->
            <div class="w-[280px] sm:w-[400px]">
              <p-iftalabel>
                <p-select
                  id="estadoRegistro"
                  formControlName="estadoRegistro"
                  [options]="estados"
                  optionLabel="descripcion"
                  optionValue="valor"
                  placeholder="Selecciona estado"
                  class="w-full"
                  appendTo="body"
                ></p-select>
                <label for="estadoRegistro">Estado de registro</label>
              </p-iftalabel>
            </div>
          </div>

          <!-- Botones (derecha) -->
          <div class="flex items-center gap-2 ml-auto pt-1">
            <p-button
              icon="pi pi-search"
              label="Buscar"
              (onClick)="filtrar()"
              [outlined]="true"
              severity="info"
              iconPos="top"
              styleClass="w-[100px]"
            ></p-button>
            <p-button
              icon="pi pi-filter-slash"
              label="Limpiar"
              (onClick)="limpiarFiltros()"
              [outlined]="true"
              severity="secondary"
              iconPos="top"
              styleClass="w-[100px]"
            ></p-button>
            <p-button
              icon="pi pi-plus"
              label="Nuevo"
              [outlined]="true"
              severity="success"
              iconPos="top"
              (onClick)="nuevo()"
              styleClass="w-[100px]"
            ></p-button>
          </div>
        </div>
      </ng-template>

      <!-- HEADER: Encabezados -->
      <ng-template #header>
        <tr>
          <th pSortableColumn="descripcion" id="descripcion" class="w-[80%]">
            Descripción
            <p-sortIcon field="descripcion"/>
          </th>
          <th id="acciones" class="w-[20%] text-center">
            Acciones
          </th>
        </tr>
      </ng-template>

      <!-- BODY: Filas de datos -->
      <ng-template #body let-categoria>
        <tr>
          <td>{{ categoria.descripcion }}</td>
          <td class="text-center">
            <div class="flex items-center justify-center gap-1">
              <p-button
                icon="pi pi-users"
                [rounded]="true"
                severity="info"
                [outlined]="true"
                pTooltip="Vincular usuarios"
                tooltipPosition="left"
                size="small"
                (onClick)="mostrarVinculo(categoria.codigo)"
              />
              <p-button
                icon="pi pi-file-edit"
                [rounded]="true"
                severity="info"
                [outlined]="true"
                pTooltip="Editar"
                tooltipPosition="left"
                size="small"
                (onClick)="editar(categoria.codigo)"
              />
              <p-button
                icon="pi pi-trash"
                [rounded]="true"
                severity="danger"
                [outlined]="true"
                pTooltip="Eliminar"
                tooltipPosition="left"
                size="small"
                (onClick)="delete($event, categoria.codigo)"
              />
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </form>
</p-card>

<app-form-categorias
  [(visible)]="visibleForm"
  [categoriaData]="selectedCategoria"
  (guardarRegistro)="guardar()"
  [modo]="modoUso">
</app-form-categorias>

<app-vincular-usuario-categoria
  [(visible)]="visibleVinculo"
  [UsuariosData]="usuariosVinculadosResponse"
  [Categoria]="idCategoria">
</app-vincular-usuario-categoria>
