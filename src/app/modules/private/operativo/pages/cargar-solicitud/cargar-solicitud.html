<p-toast position="top-center"></p-toast>
<p-confirmdialog></p-confirmdialog>
<app-breadcrumb [itemsBread]="misItems"></app-breadcrumb>

<form [formGroup]="filtroForm" (ngSubmit)="filtrar()">
  <p-table [value]="solicitudes"
           [tableStyle]="{ 'min-width': '50rem' }"
           [paginator]="true"
           [totalRecords]="totalRecords"
           [lazy]="true"
           [loading]="loading"
           [rows]="5"
           [rowsPerPageOptions]="[5, 10, 20]"
           stripedRows
           showGridlines
           breakpoint="960px"
           [size]="'small'"
           (onLazyLoad)="loadLazy($event)"
           currentPageReportTemplate="Mostrando del {first} al {last} de {totalRecords} registros en total"
           showCurrentPageReport="true"
           sortField="id"
           [sortOrder]="1"
  >
    <ng-template #caption>
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-2 w-full">
        <!-- Izquierda: inputs (solo en desktop) -->
        <div class="hidden sm:flex flex-row gap-2">
          <p-iftalabel>
            <input type="text"
                   pInputText
                   id="codigoSolicitud"
                   formControlName="codigoSolicitud"
                   placeholder="Código"
            />
            <label for="codigoSolicitud">Búsqueda por código</label>
          </p-iftalabel>
        </div>
        <div class="hidden sm:flex flex-row gap-2">
          <p-iftalabel>
            <p-datepicker
              formControlName="fecha"
              selectionMode="range"
              [readonlyInput]="true"
              placeholder="Fechas"
              dateFormat="dd/mm/yy"
            >
            </p-datepicker>
            <label for="codigoSolicitud">Búsqueda por rango de fechas</label>
          </p-iftalabel>
        </div>
        <div class="hidden sm:flex flex-row gap-2">
          <p-iftalabel>
            <input type="text"
                   pInputText
                   id="usuarioCarga"
                   formControlName="usuarioCarga"
                   placeholder="Usuario"
            />
            <label for="codigoSolicitud">Búsqueda por Usuario</label>
          </p-iftalabel>
        </div>

        <!-- Derecha: botones -->
        <div class="flex items-center gap-2 sm:gap-2 ml-auto">
          <p-button
            icon="pi pi-search"
            label="Buscar"
            (onClick)="filtrar()"
            [outlined]="true"
            severity="info"
            iconPos="top">
          </p-button>

          <p-button
            icon="pi pi-filter-slash"
            label="Limpiar"
            (onClick)="limpiarFiltros()"
            [outlined]="true"
            severity="secondary"
            iconPos="top">
          </p-button>

          <!-- Botón extra a la derecha -->
          <p-fileupload
            mode="basic"
            name="demo[]"
            chooseIcon="pi pi-upload"
            url="https://www.primefaces.org/cdn/api/upload.php"
            accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel"
            maxFileSize="5000000"
            [customUpload]="true"
            (uploadHandler)="onUploadHandler($event)"
            (onSelect)="onSelect($event)"
            [auto]="false"
            chooseLabel="Cargar plantilla"
            iconPos="top"
          />
        </div>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th id="codigo" class="text-center">Código de solicitud</th>
        <th id="fecha" class="text-center">Fecha de carga
          <p-sortIcon field="fecha"/>
        </th>
        <th id="usuario">Usuario de carga</th>
        <th id="cantidad" class="text-right">Cantidad de órdenes</th>
        <th id="acciones" class="text-center">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-solicitud>
      <tr>
        <td class="text-center">{{ solicitud.id }}</td>
        <td class="text-center">{{ solicitud.fechaCarga }}</td>
        <td>{{ solicitud.usuarioCarga }}</td>
        <td class="text-right">{{ solicitud.cantidadOrdenes }}</td>
        <td class="text-center">
          <p-button
            icon="pi pi-eye"
            [rounded]="true"
            severity="info"
            [outlined]="true"
            pTooltip="Resumen"
            tooltipPosition="left"
            size="small"
            (onClick)="detalle(solicitud.cargos)"
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
</form>

<app-vista-previa-solicitud
  [(visible)]="visibleVistaPrevia"
  [cargos]="cargos"
  [mostrar]="mostrarVistaPrevia"
  [selectedFile]="selectedFile"
  (refresh)="filtrar()">
</app-vista-previa-solicitud>

<app-detalle-solicitud
  [(visible)]="visibleDetalle"
  [cargos]="cargosSolicitud">
</app-detalle-solicitud>
