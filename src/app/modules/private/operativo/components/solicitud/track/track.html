<div class="bg-white shadow-md rounded-lg flex justify-center">
  <p-dialog
    header="Edit Profile"
    [modal]="true"
    [(visible)]="visible"
    [style]="{ width: '50rem' }"
    closable="false"
  >
    <!-- HEADER -->
    <ng-template #header>
      <div class="inline-flex items-center justify-center gap-2">
        <h2><span class="font-bold whitespace-nowrap">Tracking de solicitud</span></h2>
      </div>
    </ng-template>

    <!-- TABLA DE TRACKING -->
    <p-table
      [value]="trackList"
      [tableStyle]="{ 'min-width': '45rem' }"
      [size]="'small'"
      stripedRows
      showGridlines
      class="mb-4"
    >
      <ng-template #header>
        <tr>
          <th id="fecha">Fecha y hora</th>
          <th id="usuario">Usuario</th>
          <th id="evento">Evento</th>
        </tr>
      </ng-template>

      <ng-template #body let-track>
        <tr>
          <td>{{ track.fecha }}</td>
          <td>{{ track.nombreUsuario }}</td>
          <td>{{ eventoLabel(track.evento) }}</td>
        </tr>
      </ng-template>
    </p-table>

    <!-- FOOTER -->
    <ng-template #footer>
      <div class="flex justify-end pt-2">
        <p-button label="Cerrar" [outlined]="true" severity="info" (onClick)="cerrar()"></p-button>
      </div>
    </ng-template>
  </p-dialog>
</div>
