<div class="bg-white shadow-md rounded-lg flex justify-center">
  <p-dialog
    header="Edit Profile"
    [modal]="true"
    [(visible)]="visible"
    [style]="{ width: '30rem' }"
    closable="false"
  >
    <p-toast></p-toast>

    <!-- HEADER -->
    <ng-template #header>
      <div class="inline-flex items-center justify-center gap-2">
        <h2><span class="font-bold whitespace-nowrap">Doble factor de autenticación</span></h2>
      </div>
    </ng-template>

    <!-- FORMULARIO -->
    <form [formGroup]="form" class="flex flex-col">

      <!-- Panel 1: Credenciales -->
      <p-panel class="mb-3 shadow-none">
        <div class="p-2 flex flex-col gap-3">

          <!-- Campo Usuario -->
          <div class="flex flex-col gap-1">
            <label for="usuario" class="text-sm font-medium text-gray-700">Usuario</label>
            <input
              type="text"
              id="usuario"
              pInputText
              formControlName="usuario"
              class="w-full bg-gray-100"
              readonly
            />
          </div>

          <!-- Campo Contraseña -->
          <div class="flex flex-col gap-1">
            <label for="password" class="text-sm font-medium text-gray-700">Contraseña</label>
            <input
              id="password"
              type="password"
              pInputText
              formControlName="password"
              class="w-full"
            />
          </div>

          <!-- Botón Solicitar Código -->
          <div>
            <p-button
              label="Solicitar código"
              icon="pi pi-shield"
              variant="text"
              [raised]="true"
              severity="info"
              (onClick)="solicitar()"
              pTooltip="Solicitar código de validación">
            </p-button>
          </div>

          <!-- Loader -->
          @if (loading) {
            <div class="flex justify-center py-3">
              <p-progress-spinner
                strokeWidth="8"
                fill="transparent"
                animationDuration=".5s"
                [style]="{ width: '50px', height: '50px' }"
              />
            </div>
          }
        </div>
      </p-panel>

      <!-- Panel 2: Categorías -->
      <p-panel class="mb-3 shadow-none">
        <div class="p-2 flex flex-col gap-2">
          @for (category of categories; track category.key) {
            <div class="flex items-center gap-2 py-1">
              <p-radiobutton
                [inputId]="category.key"
                name="category"
                [value]="category"
                formControlName="category">
              </p-radiobutton>
              <label [for]="category.key" class="text-sm text-gray-700 cursor-pointer">{{ category.name }}</label>
            </div>
          }
        </div>
      </p-panel>
    </form>

    <!-- Panel 3: Código OTP -->
    <p-panel class="shadow-none">
      <ng-template #header>
        <div class="flex items-center gap-2">
          <i class="pi pi-lock text-blue-500"></i>
          <span class="font-bold text-sm">Ingrese código de validación</span>
        </div>
      </ng-template>

      <div class="flex justify-center p-4">
        <p-inputotp
          [disabled]="!otpEnabled"
          [(ngModel)]="value"
          size="large"
          [length]="6">
        </p-inputotp>
      </div>
    </p-panel>

    <!-- FOOTER -->
    <ng-template #footer>
      <div class="flex justify-end gap-2 pt-2">
        <p-button label="Cancelar" [outlined]="true" severity="info" (onClick)="cerrar()"></p-button>

        @if (modo === 'autorizar') {
          <p-button
            label="Autenticar"
            [outlined]="true"
            severity="success"
            (onClick)="autenticar()"
            [disabled]="!otpComplete">
          </p-button>
        }

        @if (modo === 'ejecutar') {
          <p-button
            label="Procesar"
            [outlined]="true"
            severity="success"
            (onClick)="procesar()"
            [disabled]="!otpComplete">
          </p-button>
        }
      </div>
    </ng-template>
  </p-dialog>
</div>
