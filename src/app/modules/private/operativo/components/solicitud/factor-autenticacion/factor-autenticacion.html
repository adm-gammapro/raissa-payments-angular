<div class="card flex justify-center">
  <p-dialog header="Edit Profile" [modal]="true" [(visible)]="visible" [style]="{ width: '30rem' }" closable="false">
    <ng-template #header>
      <div class="inline-flex items-center justify-center gap-2">
        <h2><span class="font-bold whitespace-nowrap">Doble factor de autenticación</span></h2>
      </div>
    </ng-template>

    <form [formGroup]="form" class="flex flex-column">
      <p-panel class="mb-1">
        <div class="p-1">
          <div class="field">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" pInputText formControlName="usuario" class="w-full"/>
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" type="password" pInputText formControlName="password" class="w-full"/>
          </div>
          <div class="field">
            <p-button label="Solicitar código"
                      icon="pi pi-shield"
                      variant="text"
                      [raised]="true"
                      severity="info"
                      (onClick)="solicitar()"
                      pTooltip="Solicitar código de validación">
            </p-button>
          </div>
        </div>
      </p-panel>
      <p-panel class="mb-1">
        @for (category of categories; track category.key) {
          <div class="field-checkbox flex items-center">
            <p-radiobutton
              [inputId]="category.key"
              name="category"
              [value]="category"
              formControlName="category">
            </p-radiobutton>
            <label [for]="category.key" class="ml-2">{{ category.name }}</label>
          </div>
        }
      </p-panel>
    </form>

    <p-panel>
      <ng-template #header>
        <div class="flex items-center gap-2">
          <span class="font-bold">Ingrese código de validación</span>
        </div>
      </ng-template>
      <div class="flex overflow-hidden">
        <div class="flex-grow-1 flex align-items-center justify-content-center m-1">
          <p-inputotp [disabled]="!otpEnabled" [(ngModel)]="value" size="large"></p-inputotp>
        </div>
      </div>
    </p-panel>

    <ng-template #footer>
      <p-button label="Cancelar" [outlined]="true" severity="info" (onClick)="cerrar()"></p-button>
      <p-button label="Autenticar" [outlined]="true" severity="success" (onClick)="autenticar()" [disabled]="!otpComplete"></p-button>
    </ng-template>
  </p-dialog>
</div>
