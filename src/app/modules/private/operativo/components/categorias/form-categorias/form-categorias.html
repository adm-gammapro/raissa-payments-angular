<div class="bg-white shadow-md rounded-lg flex justify-center">
  <p-dialog
    header="Edit Profile"
    [modal]="true"
    [(visible)]="visible"
    [style]="{ width: '30rem' }"
    closable="false"
  >
    <!-- HEADER -->
    <ng-template #header>
      <div class="inline-flex items-center justify-center gap-2">
        <h2><span class="font-bold whitespace-nowrap">{{ headerTitle }}</span></h2>
      </div>
    </ng-template>

    <!-- BODY: Formulario -->
    <form [formGroup]="form" class="flex flex-col">
      <p-panel class="mb-3 border-none shadow-none">
        <input type="hidden" formControlName="codigo">

        <div class="p-2 flex flex-col gap-3">

          <!-- Campo: Descripción -->
          <div class="flex flex-col gap-1">
            <label for="descripcion" class="text-sm font-medium text-gray-700">Descripción</label>
            <input
              type="text"
              id="descripcion"
              pInputText
              formControlName="descripcion"
              class="w-full"
              [class.ng-invalid]="form.get('descripcion')?.invalid && form.get('descripcion')?.touched"
              [class.ng-dirty]="form.get('descripcion')?.touched"
            />
            @if (form.get('descripcion')?.touched && form.get('descripcion')?.errors) {
              @if (form.get('descripcion')?.errors?.['required']) {
                <p-message severity="error" variant="simple" size="small">Campo obligatorio</p-message>
              }
            }
          </div>

        </div>
      </p-panel>
    </form>

    <!-- FOOTER -->
    <ng-template #footer>
      <div class="flex justify-end gap-2">
        <p-button label="Cancelar" [outlined]="true" severity="info" (onClick)="cerrar()"></p-button>
        <p-button label="Guardar" [outlined]="true" severity="success" (onClick)="guardar()"></p-button>
      </div>
    </ng-template>
  </p-dialog>
</div>
