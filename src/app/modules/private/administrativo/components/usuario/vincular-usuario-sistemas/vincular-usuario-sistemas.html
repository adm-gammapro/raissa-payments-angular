<div class="bg-white shadow-md rounded-lg flex justify-center">
  <p-dialog
    [header]="headerTitle"
    [modal]="true"
    [(visible)]="visible"
    [style]="{ width: '60rem' }"
    [closable]="false"
    [dismissableMask]="false"
  >
    <!-- HEADER -->
    <ng-template #header>
      <div class="inline-flex items-center justify-center gap-2">
        <i class="pi pi-sliders-h text-blue-500"></i>
        <h2><span class="font-bold whitespace-nowrap">{{ headerTitle }}</span></h2>
      </div>
    </ng-template>

    <!-- BODY: Picklist -->
    <div class="bg-white rounded-lg">
      <div class="grid grid-cols-2 gap-4 mb-4 text-center text-sm font-medium text-gray-600">
        <div class="col-span-1">
          <span>Sistemas Disponibles</span>
        </div>
        <div class="col-span-1">
          <span>Sistemas Asignados</span>
        </div>
      </div>

      <p-picklist
        [source]="sourceSistemas"
        [target]="targetSistemas"
        [dragdrop]="true"
        [responsive]="true"
        [sourceStyle]="{ height: '25rem' }"
        [targetStyle]="{ height: '25rem' }"
        [showSourceControls]="false"
        [showTargetControls]="false"
        breakpoint="1400px"
        scrollHeight="30rem"
      >
        <ng-template let-sistema pTemplate="item">
          <div class="flex flex-wrap p-2 items-center gap-4 w-full hover:bg-gray-50 rounded-lg transition-colors">
            <div class="flex-1 flex flex-col">
              <span class="font-medium text-sm text-gray-800">{{ sistema.nombre }}</span>
              <span class="text-xs text-gray-500">ID: {{ sistema.id }}</span>
            </div>
          </div>
        </ng-template>
      </p-picklist>

      <!-- Indicador de carga -->
      <div *ngIf="isLoading" class="flex justify-center items-center py-4">
        <i class="pi pi-spin pi-spinner text-blue-500 text-2xl"></i>
        <span class="ml-2 text-gray-600">Cargando...</span>
      </div>
    </div>

    <!-- FOOTER -->
    <ng-template #footer>
      <div class="flex justify-end gap-2 pt-2">
        <p-button
          label="Cancelar"
          [outlined]="true"
          severity="secondary"
          (onClick)="cerrar()"
          [disabled]="isLoading"
        ></p-button>
        <p-button
          label="Guardar Cambios"
          severity="primary"
          (onClick)="aplicarCambios($event)"
          [loading]="isLoading"
          [disabled]="isLoading"
        ></p-button>
      </div>
    </ng-template>
  </p-dialog>
</div>
